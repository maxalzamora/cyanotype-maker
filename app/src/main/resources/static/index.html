<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyanotypes — digital negative</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1>cyan<span>o</span>types</h1>
    <p class="sub">Drop a photograph. Get the negative you print on transparency
      for a cyanotype contact print.</p>
  </header>

  <form id="form">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/png,image/jpeg,image/tiff,image/gif" hidden>
      <strong id="drop-title">Choose an image or drop it here</strong>
      <small>PNG, JPEG, TIFF or GIF · up to 25 MB</small>
    </label>

    <div class="controls">
      <label for="profile">Process profile</label>
      <select id="profile">
        <option value="cyanotype">Cyanotype</option>
      </select>
    </div>

    <div class="controls">
      <label for="paper">Paper</label>
      <select id="paper">
        <option value="a4">A4</option>
      </select>
      <label for="dpi">Resolution</label>
      <select id="dpi">
        <option value="300">300 ppi</option>
        <option value="600" selected>600 ppi</option>
        <option value="1200">1200 ppi</option>
      </select>
      <label class="check">
        <input type="checkbox" id="mirror">
        Mirror for ink-down film
      </label>
    </div>

    <div class="controls">
      <button id="go" type="submit" disabled>Make negative</button>
    </div>
  </form>

  <p id="status" role="status"></p>

  <figure id="result" hidden>
    <img id="out" alt="The rendered digital negative">
    <figcaption><span id="meta"></span></figcaption>
    <div class="print">
      <span>Print files</span>
      <button type="button" class="button secondary" id="tiff">16-bit TIFF</button>
      <button type="button" class="button secondary" id="pdf">PDF at page size</button>
      <span id="print-info"></span>
    </div>
  </figure>

  <p class="note">Stage 4: tone calibration from a measured print. <a href="/calibrate.html">Calibrate
    a profile</a> from a scanned step wedge; the result appears in the profile list above.</p>
</main>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('file');
  const drop = document.getElementById('drop');
  const dropTitle = document.getElementById('drop-title');
  const button = document.getElementById('go');
  const profileSelect = document.getElementById('profile');
  const paperSelect = document.getElementById('paper');
  const dpiSelect = document.getElementById('dpi');
  const mirrorInput = document.getElementById('mirror');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const out = document.getElementById('out');
  const meta = document.getElementById('meta');
  const printInfo = document.getElementById('print-info');
  const tiffButton = document.getElementById('tiff');
  const pdfButton = document.getElementById('pdf');

  let objectUrl = null;

  function describe(file) {
    const kb = file.size / 1024;
    const size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB';
    return file.name + ' · ' + size;
  }

  function choose(file) {
    if (!file) return;
    dropTitle.textContent = describe(file);
    drop.classList.add('has-file');
    button.disabled = false;
    status.textContent = '';
    status.classList.remove('error');
  }

  function paperName() {
    const option = paperSelect.selectedOptions[0];
    return option ? option.textContent : paperSelect.value;
  }

  function refreshPrintInfo() {
    printInfo.textContent = paperName() + ' · ' + dpiSelect.value + ' ppi · 10 mm margins';
  }

  input.addEventListener('change', () => choose(input.files[0]));

  ['dragenter', 'dragover'].forEach(type =>
    drop.addEventListener(type, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(type =>
    drop.addEventListener(type, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const transfer = new DataTransfer();
    transfer.items.add(file);
    input.files = transfer.files;
    choose(file);
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    await render();
  });

  [profileSelect, paperSelect, dpiSelect, mirrorInput].forEach(control =>
    control.addEventListener('change', () => {
      refreshPrintInfo();
      if (input.files[0] && !result.hidden) render();
    }));

  tiffButton.addEventListener('click', () => download('tiff'));
  pdfButton.addEventListener('click', () => download('pdf'));

  // Selectors are built from the server's catalogue, so the UI cannot drift out of sync
  // with what the API actually accepts.
  fetch('/api/profiles')
    .then(response => response.ok ? response.json() : Promise.reject())
    .then(profiles => {
      profileSelect.replaceChildren(...profiles.map(profile => {
        const option = document.createElement('option');
        option.value = profile.id;
        option.textContent = profile.name;
        option.selected = profile.id === 'cyanotype';
        return option;
      }));
    })
    .catch(() => { /* keep the fallback option */ });

  fetch('/api/papers')
    .then(response => response.ok ? response.json() : Promise.reject())
    .then(papers => {
      paperSelect.replaceChildren(...papers.map(paper => {
        const option = document.createElement('option');
        option.value = paper.id;
        option.textContent = paper.id === 'inch_8x10'
          ? '8 × 10 in'
          : paper.id.charAt(0).toUpperCase() + paper.id.slice(1);
        return option;
      }));
      refreshPrintInfo();
    })
    .catch(refreshPrintInfo);

  function formData(format) {
    const body = new FormData();
    body.append('file', input.files[0]);
    body.append('profile', profileSelect.value);
    body.append('format', format);
    body.append('paper', paperSelect.value);
    body.append('dpi', dpiSelect.value);
    body.append('margin', '10');
    body.append('mirror', mirrorInput.checked ? 'true' : 'false');
    return body;
  }

  async function failure(response) {
    let message = response.status + ' ' + response.statusText;
    try { message = (await response.json()).message || message; } catch (_) { /* not json */ }
    return new Error(message);
  }

  async function render() {
    if (!input.files[0]) return;

    button.disabled = true;
    status.classList.remove('error');
    status.textContent = 'Rendering…';

    try {
      const response = await fetch('/api/render', { method: 'POST', body: formData('png') });
      if (!response.ok) throw await failure(response);

      const blob = await response.blob();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(blob);
      out.src = objectUrl;

      meta.textContent = [
        response.headers.get('X-Profile'),
        response.headers.get('X-Source-Format'),
        response.headers.get('X-Source-Width') + ' × ' +
        response.headers.get('X-Source-Height')
      ].join(' · ');

      result.hidden = false;
      status.textContent = '';
      refreshPrintInfo();
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function download(format) {
    if (!input.files[0]) return;

    const previous = status.textContent;
    status.classList.remove('error');
    status.textContent = 'Building ' + format.toUpperCase() + '…';

    try {
      const response = await fetch('/api/render', { method: 'POST', body: formData(format) });
      if (!response.ok) throw await failure(response);

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'negative.' + format;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);

      status.textContent = [
        response.headers.get('X-Paper'),
        response.headers.get('X-Effective-Ppi') + ' ppi',
        response.headers.get('X-Print-Width-Mm') + ' × ' +
        response.headers.get('X-Print-Height-Mm') + ' mm',
        response.headers.get('X-Mirrored') === 'true' ? 'mirrored' : null
      ].filter(Boolean).join(' · ');
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.message || previous;
    }
  }
</script>
</body>
</html>
